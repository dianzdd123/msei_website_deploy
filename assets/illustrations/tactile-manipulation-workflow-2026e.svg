<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc"><title id="title">From touch to adaptable action</title><desc id="desc">Touch and vision — Contact deformation and visual observations; Represent the physical state — Infer useful contact and object information; Learn an action policy — Demonstrations, simulation and multimodal learning; Grasp, move and adapt — Control interaction with the object. New contact provides feedback|for the next action</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="1280" height="540" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="42" y="52" fill="#003E74" font-size="28" font-weight="700" text-anchor="start">From touch to adaptable action</text><text x="42" y="86" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Sensing hardware and learning are developed together</text><rect x="42" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="62" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">01</text><g transform="translate(62 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v25l12 10m28-35v25L40 43M24 43l-6 12m22-12 6 12"/><circle cx="32" cy="38" r="9"/><path d="M24 9c5-5 11-5 16 0m-13 7c3-3 7-3 10 0"/></g><text x="62" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Touch and</text><text x="62" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">vision</text><text x="62" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Contact deformation</text><text x="62" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">and visual observations</text><rect x="349" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="369" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">02</text><g transform="translate(369 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30c13-22 41-22 54 0-13 22-41 22-54 0Z"/><circle cx="32" cy="30" r="10"/></g><text x="369" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Represent the</text><text x="369" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">physical state</text><text x="369" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Infer useful contact</text><text x="369" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">and object information</text><rect x="656" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="676" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">03</text><g transform="translate(676 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="14" r="7"/><circle cx="51" cy="14" r="7"/><circle cx="32" cy="50" r="7"/><path d="m17 20 11 23m19-23L36 43M21 14h22"/></g><text x="676" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Learn an</text><text x="676" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">action policy</text><text x="676" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Demonstrations, simulation</text><text x="676" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">and multimodal learning</text><rect x="963" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="983" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">04</text><g transform="translate(983 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 56V30c0-7 8-8 11-2V14c0-8 9-8 9 0v16-20c0-8 9-8 9 0v22-13c0-8 9-8 9 0v22c0 13-9 19-20 19-10 0-18-4-18-4Z"/></g><text x="983" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Grasp, move</text><text x="983" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">and adapt</text><text x="983" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Control interaction</text><text x="983" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">with the object</text><path d="M322 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M629 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M936 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 405v35H180v-35" fill="none" stroke="#6B3FA0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="421" width="580" height="40" rx="20" fill="#F4F7FC"/><text x="640" y="448" fill="#6B3FA0" font-size="19" font-weight="600" text-anchor="middle">New contact provides feedback for the next action</text><text x="640" y="499" fill="#506A82" font-size="16" font-weight="400" text-anchor="middle">Conceptual synthesis across tactile sensing and manipulation studies; not a single implementation.</text></g></svg>