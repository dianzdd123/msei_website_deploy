<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" width="640" height="1320" role="img" aria-labelledby="title desc"><title id="title">Shared control for precise interaction</title><desc id="desc">Operator intent — Commands from the human interface; Estimate task context — Tool state and observed task progress; Adapt the assistance — Control allocation, motion scaling or damping; Tool motion and feedback — Precise actions with visual or haptic feedback. The operator observes feedback|and continues the interaction</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="640" height="1320" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="52" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">Shared control for precise</text><text x="36" y="90" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">interaction</text><text x="36" y="128" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">Four connected stages</text><rect x="36" y="166" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="198" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">01</text><g transform="translate(58 232) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="13" r="8"/><path d="M11 55V37c0-14 26-14 26 0v18M18 37v18m14-18v18M40 28h15v20H40m7-19v-9m-4 0h8"/></g><text x="152" y="214" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Operator</text><text x="152" y="250" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">intent</text><text x="152" y="296" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Commands from the human</text><text x="152" y="329" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">interface</text><rect x="36" y="422" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="454" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">02</text><g transform="translate(58 488) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30c13-22 41-22 54 0-13 22-41 22-54 0Z"/><circle cx="32" cy="30" r="10"/></g><text x="152" y="470" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Estimate</text><text x="152" y="506" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">task context</text><text x="152" y="552" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Tool state and observed</text><text x="152" y="585" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">task progress</text><rect x="36" y="678" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="710" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">03</text><g transform="translate(58 744) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v50M32 6v50M52 6v50"/><circle cx="12" cy="21" r="6"/><circle cx="32" cy="42" r="6"/><circle cx="52" cy="27" r="6"/></g><text x="152" y="726" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Adapt the</text><text x="152" y="762" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">assistance</text><text x="152" y="808" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Control allocation, motion</text><text x="152" y="841" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">scaling or damping</text><rect x="36" y="934" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="966" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">04</text><g transform="translate(58 1000) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8 14 14m34-14L42 22M22 22l8 21m12-21-8 21M21 23l-8 8m29-9 9 8"/><path d="M18 52h28m-19-9v9m11-9v9"/></g><text x="152" y="982" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Tool motion</text><text x="152" y="1018" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">and feedback</text><text x="152" y="1064" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Precise actions with visual</text><text x="152" y="1097" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">or haptic feedback</text><path d="M320.0 386v28" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M320.0 642v28" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M320.0 898v28" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1188" width="568" height="120" rx="14" fill="#EEE8F7"/><g transform="translate(56 1215) scale(0.625)" fill="none" stroke="#6B3FA0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24a23 23 0 0 1 39-11l6 6m0-14v14H43M52 40a23 23 0 0 1-39 11l-6-6m0 14V45h14"/></g><text x="116" y="1225" fill="#6B3FA0" font-size="26" font-weight="600" text-anchor="start">The operator observes feedback</text><text x="116" y="1258" fill="#6B3FA0" font-size="26" font-weight="600" text-anchor="start">and continues the interaction</text></g></svg>