<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc"><title id="title">Locating tools in microscope images</title><desc id="desc">Microscope image — Several pipettes in a complex background; Improve visibility — Suppress background before localisation; Coarse detection — Find candidate pipette-tip locations; Fine localisation — Estimate individual tip coordinates. Evaluate predictions against|annotated experimental images</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="1280" height="540" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="42" y="52" fill="#003E74" font-size="28" font-weight="700" text-anchor="start">Locating tools in microscope images</text><text x="42" y="86" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">An example from multi-pipette localisation research</text><rect x="42" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="62" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">01</text><g transform="translate(62 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="52" height="45" rx="4"/><circle cx="20" cy="23" r="5"/><path d="m8 48 13-13 9 7 13-18 13 17"/></g><text x="62" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Microscope</text><text x="62" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">image</text><text x="62" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Several pipettes in</text><text x="62" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">a complex background</text><rect x="349" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="369" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">02</text><g transform="translate(369 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9h50L38 32v21l-12 5V32L7 9Z"/><path d="M18 9v10m14-10v10m14-10v10"/></g><text x="369" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Improve</text><text x="369" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">visibility</text><text x="369" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Suppress background</text><text x="369" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">before localisation</text><rect x="656" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="676" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">03</text><g transform="translate(676 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V8h13m22 0h13v13m0 22v13H43m-22 0H8V43"/><rect x="20" y="20" width="24" height="24" rx="4"/><circle cx="32" cy="32" r="3"/></g><text x="676" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Coarse</text><text x="676" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">detection</text><text x="676" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Find candidate</text><text x="676" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">pipette-tip locations</text><rect x="963" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="983" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">04</text><g transform="translate(983 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="11"/><path d="M32 2v12m0 36v12M2 32h12m36 0h12"/></g><text x="983" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Fine</text><text x="983" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">localisation</text><text x="983" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Estimate individual</text><text x="983" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">tip coordinates</text><path d="M322 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M629 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M936 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 405v35H180v-35" fill="none" stroke="#6B3FA0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="421" width="580" height="40" rx="20" fill="#F4F7FC"/><text x="640" y="448" fill="#6B3FA0" font-size="19" font-weight="600" text-anchor="middle">Evaluate predictions against annotated experimental images</text><text x="640" y="499" fill="#506A82" font-size="16" font-weight="400" text-anchor="middle">A perception component within a larger experimental workflow; it does not automate the whole experiment.</text></g></svg>