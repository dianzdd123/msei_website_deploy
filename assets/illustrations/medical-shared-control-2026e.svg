<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc"><title id="title">Shared control for precise interaction</title><desc id="desc">Operator intent — Commands from the human interface; Estimate task context — Tool state and observed task progress; Adapt the assistance — Control allocation, motion scaling or damping; Tool motion and feedback — Precise actions with visual or haptic feedback. The operator observes feedback|and continues the interaction</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="1280" height="540" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="42" y="52" fill="#003E74" font-size="28" font-weight="700" text-anchor="start">Shared control for precise interaction</text><text x="42" y="86" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Human intent and task observations inform assistance</text><rect x="42" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="62" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">01</text><g transform="translate(62 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="13" r="8"/><path d="M11 55V37c0-14 26-14 26 0v18M18 37v18m14-18v18M40 28h15v20H40m7-19v-9m-4 0h8"/></g><text x="62" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Operator</text><text x="62" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">intent</text><text x="62" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Commands from the</text><text x="62" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">human interface</text><rect x="349" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="369" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">02</text><g transform="translate(369 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30c13-22 41-22 54 0-13 22-41 22-54 0Z"/><circle cx="32" cy="30" r="10"/></g><text x="369" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Estimate</text><text x="369" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">task context</text><text x="369" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Tool state and</text><text x="369" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">observed task progress</text><rect x="656" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="676" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">03</text><g transform="translate(676 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v50M32 6v50M52 6v50"/><circle cx="12" cy="21" r="6"/><circle cx="32" cy="42" r="6"/><circle cx="52" cy="27" r="6"/></g><text x="676" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Adapt the</text><text x="676" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">assistance</text><text x="676" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Control allocation,</text><text x="676" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">motion scaling or damping</text><rect x="963" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="983" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">04</text><g transform="translate(983 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8 14 14m34-14L42 22M22 22l8 21m12-21-8 21M21 23l-8 8m29-9 9 8"/><path d="M18 52h28m-19-9v9m11-9v9"/></g><text x="983" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Tool motion</text><text x="983" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">and feedback</text><text x="983" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Precise actions with</text><text x="983" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">visual or haptic feedback</text><path d="M322 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M629 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M936 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 405v35H180v-35" fill="none" stroke="#6B3FA0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="421" width="580" height="40" rx="20" fill="#F4F7FC"/><text x="640" y="448" fill="#6B3FA0" font-size="19" font-weight="600" text-anchor="middle">The operator observes feedback and continues the interaction</text><text x="640" y="499" fill="#506A82" font-size="16" font-weight="400" text-anchor="middle">Illustrative shared-control loop for research and training systems; not a clinical workflow.</text></g></svg>