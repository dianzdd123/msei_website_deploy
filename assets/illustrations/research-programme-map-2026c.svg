<title id="title">MSEI research programme: connected methods across physical settings</title><desc id="desc">Sensing, learning, shared control and embodiment design connect through physical interaction and evaluation. They are studied across contact-rich manipulation, medical and scientific manipulation, and optical and magnetic robotics. Specific methods and results differ by project.</desc>
