<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" width="640" height="1320" role="img" aria-labelledby="title desc"><title id="title">Locating tools in microscope images</title><desc id="desc">Microscope image — Several pipettes in a complex background; Improve visibility — Suppress background before localisation; Coarse detection — Find candidate pipette-tip locations; Fine localisation — Estimate individual tip coordinates. Evaluate predictions against|annotated experimental images</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="640" height="1320" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="52" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">Locating tools in microscope</text><text x="36" y="90" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">images</text><text x="36" y="128" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">Four connected stages</text><rect x="36" y="166" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="198" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">01</text><g transform="translate(58 232) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="52" height="45" rx="4"/><circle cx="20" cy="23" r="5"/><path d="m8 48 13-13 9 7 13-18 13 17"/></g><text x="152" y="214" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Microscope</text><text x="152" y="250" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">image</text><text x="152" y="296" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Several pipettes in a</text><text x="152" y="329" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">complex background</text><rect x="36" y="422" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="454" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">02</text><g transform="translate(58 488) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9h50L38 32v21l-12 5V32L7 9Z"/><path d="M18 9v10m14-10v10m14-10v10"/></g><text x="152" y="470" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Improve</text><text x="152" y="506" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">visibility</text><text x="152" y="552" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Suppress background before</text><text x="152" y="585" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">localisation</text><rect x="36" y="678" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="710" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">03</text><g transform="translate(58 744) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V8h13m22 0h13v13m0 22v13H43m-22 0H8V43"/><rect x="20" y="20" width="24" height="24" rx="4"/><circle cx="32" cy="32" r="3"/></g><text x="152" y="726" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Coarse</text><text x="152" y="762" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">detection</text><text x="152" y="808" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Find candidate pipette-tip</text><text x="152" y="841" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">locations</text><rect x="36" y="934" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="966" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">04</