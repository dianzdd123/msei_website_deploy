<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" width="640" height="1320" role="img" aria-labelledby="title desc"><title id="title">How to read the evidence</title><desc id="desc">Task and conditions — Which robot, object, scale and environment?; Meaningful comparison — What is compared, and what stays fixed?; Measurements and outcomes — Which errors, successes or user measures?; Scope and next question — What was established, and what remains open?. Use the full paper to assess|the claim in its experimental setting</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="640" height="1320" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="52" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">How to read the evidence</text><text x="36" y="128" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">Four connected stages</text><rect x="36" y="166" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="198" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">01</text><g transform="translate(58 232) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="11"/><path d="M32 2v12m0 36v12M2 32h12m36 0h12"/></g><text x="152" y="214" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Task and</text><text x="152" y="250" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">conditions</text><text x="152" y="296" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Which robot, object, scale</text><text x="152" y="329" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">and environment?</text><rect x="36" y="422" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="454" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">02</text><g transform="translate(58 488) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 13h36M32 7v48M9 55h46M14 13 4 34h20L14 13Zm36 0L40 34h20L50 13Z"/></g><text x="152" y="470" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Meaningful</text><text x="152" y="506" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">comparison</text><text x="152" y="552" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">What is compared, and what</text><text x="152" y="585" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">stays fixed?</text><rect x="36" y="678" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="710" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">03</text><g transform="translate(58 744) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7v47h47M20 44V30m12 14V17m12 27V24"/><path d="m17 20 12-9 13 5 11-9"/></g><text x="152" y="726" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Measurements</text><text x="152" y="762" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">and outcomes</text><text x="152" y="808" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Which errors, successes or</text><text x="152" y="841" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">user measures?</text><rect x="36" y="934" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="966" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">04</text><g transform="translate(58 1000) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5h34v54H15V5Zm8 14 4 4 9-9m-13 22 4 4 9-9m-13 23h18"/></g><text x="152" y="982" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Scope and</text><text x="152" y="1018" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">next question</text><text x="152" y="1064" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">What was established, and</text><text x="152" y="1097" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">what remains open?</text><path d="M320.0 386v28" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M320.0 642v28" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M320.0 898v28" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1188" width="568" height="120" rx="14" fill="#EEE8F7"/><g transform="translate(56 1215) scale(0.625)" fill="none" stroke="#6B3FA0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 24a23 23 0 0 1 39-11l6 6m0-14v14H43M52 40a23 23 0 0 1-39 11l-6-6m0 14V45h14"/></g><text x="116" y="1225" fill="#6B3FA0" font-size="26" font-weight="600" text-anchor="start">Use the full paper to assess</text><text x="116" y="1258" fill="#6B3FA0" font-size="26" font-weight="600" text-anchor="start">the claim in its experimental</text><text x="116" y="1291" fill="#6B3FA0" font-size="26" font-weight="600" text-anchor="start">setting</text></g></svg>