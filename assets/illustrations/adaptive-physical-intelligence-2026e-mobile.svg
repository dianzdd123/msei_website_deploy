<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1440" width="640" height="1440" role="img" aria-labelledby="title desc"><title id="title">Adaptive physical intelligence as four coupled research questions</title><desc id="desc">Sensing, learning, adaptive control and physical design connect through observations of physical interaction. The diagram describes a research programme, not a completed system.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="640" height="1440" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="54" fill="#003E74" font-size="34" font-weight="700" text-anchor="start">Adaptive physical intelligence</text><text x="36" y="95" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">Four coupled questions, grounded in</text><text x="36" y="127" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">physical interaction</text><rect x="92" y="168" width="512" height="130" rx="18" fill="#003E74"/><text x="348" y="218" fill="#FFFFFF" font-size="32" font-weight="700" text-anchor="middle">Physical interaction</text><text x="348" y="262" fill="#D8C8F2" font-size="24" font-weight="400" text-anchor="middle">Contact · motion · observation</text><path d="M92 234H52V1320" stroke="#6B3FA0" fill="none" stroke-width="3"/><path d="M52 420h34" stroke="#6B3FA0" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="92" y="336" width="512" height="226" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(112 396) scale(0.875)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30c13-22 41-22 54 0-13 22-41 22-54 0Z"/><circle cx="32" cy="30" r="10"/></g><text x="190" y="382" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">Sense physical state</text><text x="190" y="468" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">What can touch and images</text><text x="190" y="500" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">reveal about interaction?</text><path d="M52 680h34" stroke="#6B3FA0" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="92" y="596" width="512" height="226" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(112 656) scale(0.875)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="14" r="7"/><circle cx="51" cy="14" r="7"/><circle cx="32" cy="50" r="7"/><path d="m17 20 11 23m19-23L36 43M21 14h22"/></g><text x="190" y="642" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">Learn useful</text><text x="190" y="677" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">behaviours</text><text x="190" y="728" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">What knowledge can</text><text x="190" y="760" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">transfer with limited new</text><text x="190" y="792" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">data?</text><path d="M52 940h34" stroke="#6B3FA0" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="92" y="856" width="512" height="226" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(112 916) scale(0.875)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v50M32 6v50M52 6v50"/><circle cx="12" cy="21" r="6"/><circle cx="32" cy="42" r="6"/><circle cx="52" cy="27" r="6"/></g><text x="190" y="902" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">Adapt action</text><text x="190" y="937" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">and assistance</text><text x="190" y="988" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">How should control</text><text x="190" y="1020" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">respond to the task and</text><text x="190" y="1052" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">operator?</text><path d="M52 1200h34" stroke="#6B3FA0" fill="none" stroke-width="3" marker-end="url(#arrow)"/><rect x="92" y="1116" width="512" height="226" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(112 1176) scale(0.875)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m32 5 23 13v27L32 59 9 45V18L32 5Zm0 27v27M9 18l23 14 23-14"/></g><text x="190" y="1162" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">Design physical</text><text x="190" y="1197" fill="#003E74" font-size="30" font-weight="700" text-anchor="start">capability</text><text x="190" y="1248" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">How do sensors, tools and</text><text x="190" y="1280" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">actuation shape what is</text><text x="190" y="1312" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">possible?</text><text x="320" y="1392" fill="#506A82" font-size="24" font-weight="400" text-anchor="middle">Programme synthesis</text><text x="320" y="1420" fill="#506A82" font-size="24" font-weight="400" text-anchor="middle">Not a single completed system</text></g></svg>