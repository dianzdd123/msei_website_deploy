<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" aria-labelledby="title desc">
<title id="title">From question to application</title>
<desc id="desc">PhD · Bioengineering. 1: Find research fit. Read relevant work and identify a focused question. 2: Discuss supervision. Explore project scope, availability and a possible funding route. 3: Apply through Imperial. Follow Bioengineering’s process and the scheme’s instructions. 4: Complete selection. Interview where shortlisted; meet formal offer conditions.</desc>
