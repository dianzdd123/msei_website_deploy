<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" width="640" height="1320" role="img" aria-labelledby="title desc"><title id="title">From touch to adaptable action</title><desc id="desc">Touch and vision — Contact deformation and visual observations; Represent the physical state — Infer useful contact and object information; Learn an action policy — Demonstrations, simulation and multimodal learning; Grasp, move and adapt — Control interaction with the object. New contact provides feedback|for the next action</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="640" height="1320" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="52" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">From touch to adaptable action</text><text x="36" y="128" fill="#506A82" font-size="27" font-weight="400" text-anchor="start">Four connected stages</text><rect x="36" y="166" width="568" height="214" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="56" y="198" fill="#6B3FA0" font-size="19" font-weight="700" text-anchor="start">01</text><g transform="translate(58 232) scale(1.03125)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v25l12 10m28-35v25L40 43M24 43l-6 12m22-12 6 12"/><circle cx="32" cy="38" r="9"/><path d="M24 9c5-5 11-5 16 0m-13 7c3-3 7-3 10 0"/></g><text x="152" y="214" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">Touch and</text><text x="152" y="250" fill="#003E74" font-size="31" font-weight="700" text-anchor="start">vision</text><text x="152" y="296" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">Contact deformation and</text><text x="152" y="329" fill="#506A82" font-size="28" font-weight="400" text-anchor="start">visual observations</text><rect x="36" y="422" width="568" hei