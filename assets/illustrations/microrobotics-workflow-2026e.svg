<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc"><title id="title">Microrobotics in the loop</title><desc id="desc">Observe under a microscope — Images of the robot and its surroundings; Estimate pose and depth — Infer physical state from limited observations; Choose fields and forces — Optical or magnetic actuation and assistance; Manipulate and evaluate — Examine motion, contact and task performance. Observe the physical response|and refine the next action</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="1280" height="540" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="42" y="52" fill="#003E74" font-size="28" font-weight="700" text-anchor="start">Microrobotics in the loop</text><text x="42" y="86" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Perception, external actuation and physical response</text><rect x="42" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="62" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">01</text><g transform="translate(62 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m29 5 16 9-11 20-16-9 11-20Zm0 31v10m-14 0h33M44 24c17 13 10 28-5 28H16m-6 6h46"/><path d="m33 3 16 9"/></g><text x="62" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Observe under</text><text x="62" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">a microscope</text><text x="62" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Images of the robot</text><text x="62" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">and its surroundings</text><rect x="349" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="369" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">02</text><g transform="translate(369 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 30V7m0 23 23 14M32 30 10 45"/><path d="m28 13 4-6 4 6m11 28 8 3-4-7M18 43l-8 2 3-7"/><circle cx="32" cy="30" r="8"/></g><text x="369" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Estimate pose</text><text x="369" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">and depth</text><text x="369" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Infer physical state</text><text x="369" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">from limited observations</text><rect x="656" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="676" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">03</text><g transform="translate(676 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12v26a24 24 0 0 0 48 0V12H44v26a12 12 0 0 1-24 0V12H8Z"/><path d="M8 22h12m24 0h12M24 8c5-6 11-6 16 0M26 17c3-3 9-3 12 0"/></g><text x="676" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Choose fields</text><text x="676" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">and forces</text><text x="676" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Optical or magnetic</text><text x="676" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">actuation and assistance</text><rect x="963" y="128" width="276" height="260" rx="16" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><text x="983" y="160" fill="#6B3FA0" font-size="15" font-weight="700" text-anchor="start">04</text><g transform="translate(983 178) scale(0.90625)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8 14 14m34-14L42 22M22 22l8 21m12-21-8 21M21 23l-8 8m29-9 9 8"/><path d="M18 52h28m-19-9v9m11-9v9"/></g><text x="983" y="269" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">Manipulate</text><text x="983" y="298" fill="#003E74" font-size="24" font-weight="700" text-anchor="start">and evaluate</text><text x="983" y="339" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">Examine motion, contact</text><text x="983" y="364" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">and task performance</text><path d="M322 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M629 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M936 258h23" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 405v35H180v-35" fill="none" stroke="#6B3FA0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="421" width="580" height="40" rx="20" fill="#F4F7FC"/><text x="640" y="448" fill="#6B3FA0" font-size="19" font-weight="600" text-anchor="middle">Observe the physical response and refine the next action</text><text x="640" y="499" fill="#506A82" font-size="16" font-weight="400" text-anchor="middle">Conceptual synthesis. Optical and magnetic studies use different scales and platforms.</text></g></svg>