<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" aria-labelledby="title desc">
<title id="title">From programme to project</title>
<desc id="desc">MRes · Medical Robotics. 1: Choose the correct stream. Match the programme route to your qualifications and aims. 2: Apply to the course. Use My Imperial and the programme’s document list. 3: Explore project fit. Follow the programme’s allocation process and available supervision. 4: Develop research skills. Combine training with an allocated project and clear evaluation.</desc>
