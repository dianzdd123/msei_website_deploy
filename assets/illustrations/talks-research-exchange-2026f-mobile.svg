<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 690" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc"><title id="title">Research in conversation</title><desc id="desc">Questions, evidence and discussion provide a conceptual structure for academic exchange.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6B3FA0"/></marker></defs><rect width="400" height="690" rx="20" fill="#F4F7FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="48" font-size="24" font-weight="700" fill="#003E74">Research in conversation</text><text x="24" y="83" font-size="16" fill="#557184">A conceptual research perspective</text><rect x="24" y="132" width="352" height="118" rx="15" fill="#fff" stroke="#D8E1ED" stroke-width="1.5"/><circle cx="55" cy="165" r="17" fill="#003E74"/><text x="55" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">01</text><text x="84" y="171" font-size="20" font-weight="700" fill="#003E74">Question</text><text x="84" y="207" font-size="16" fill="#557184">What would we like to learn?</text><path d="M200 254v18" stroke="#6B3FA0" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="24" y="278" width="352" height="118" rx="15" fill="#fff" stroke="#D8E1ED" stroke-width="1.5"/><circle cx="55" cy="311" r="17" fill="#6B3FA0"/><text x="55" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">02</text><text x="84" y="317" font-size="20" font-weight="700" fill="#003E74">Evidence</text><text x="84" y="353" font-size="16" fill="#557184">What supports the argument?</text><path d="M200 400v18" stroke="#6B3FA0" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="24" y="424" width="352" height="118" rx="15" fill="#fff" stroke="#D8E1ED" stroke-width="1.5"/><circle cx="55" cy="457" r="17" fill="#003E74"/><text x="55" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">03</text><text x="84" y="463" font-size="20" font-weight="700" fill="#003E74">Discussion</text><text x="84" y="499" font-size="16" fill="#557184">Which perspective comes next?</text><rect x="24" y="592" width="352" height="73" rx="14" fill="#003E74"/><text x="200" y="622" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Share ideas. Examine assumptions.</text><text x="200" y="647" text-anchor="middle" font-size="15" fill="#D9E8F3">An illustration of academic exchange</text></g></svg>
