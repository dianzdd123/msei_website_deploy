<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc"><title id="title">Adaptive physical intelligence as four coupled research questions</title><desc id="desc">Sensing, learning, adaptive control and physical design connect through observations of physical interaction. The diagram describes a research programme, not a completed system.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6B3FA0"/></marker></defs><rect width="1280" height="720" rx="24" fill="#F4F7FC"/><g font-family="Arial, Helvetica, sans-serif"><text x="42" y="54" fill="#003E74" font-size="32" font-weight="700" text-anchor="start">Adaptive physical intelligence</text><text x="42" y="95" fill="#506A82" font-size="20" font-weight="400" text-anchor="start">Four coupled questions, grounded in physical interaction</text><path d="M362 234C447 234 415 330 470 330" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M918 234C833 234 865 330 810 330" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M362 536C447 536 415 420 470 420" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><path d="M918 536C833 536 865 420 810 420" fill="none" stroke="#6B3FA0" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="274" width="340" height="206" rx="24" fill="#003E74"/><g transform="translate(608 295) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v25l12 10m28-35v25L40 43M24 43l-6 12m22-12 6 12"/><circle cx="32" cy="38" r="9"/><path d="M24 9c5-5 11-5 16 0m-13 7c3-3 7-3 10 0"/></g><text x="640" y="397" fill="#FFFFFF" font-size="28" font-weight="700" text-anchor="middle">Physical interaction</text><text x="640" y="434" fill="#D8C8F2" font-size="19" font-weight="400" text-anchor="middle">Contact · motion · observation</text><rect x="42" y="136" width="320" height="204" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(64 156) scale(0.75)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 30c13-22 41-22 54 0-13 22-41 22-54 0Z"/><circle cx="32" cy="30" r="10"/></g><text x="132" y="185" fill="#6B3FA0" font-size="16" font-weight="700" text-anchor="start">01</text><text x="64" y="239" fill="#003E74" font-size="23" font-weight="700" text-anchor="start">Sense physical state</text><text x="64" y="294" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">What can touch and images</text><text x="64" y="320" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">reveal about interaction?</text><rect x="918" y="136" width="320" height="204" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(940 156) scale(0.75)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="14" r="7"/><circle cx="51" cy="14" r="7"/><circle cx="32" cy="50" r="7"/><path d="m17 20 11 23m19-23L36 43M21 14h22"/></g><text x="1008" y="185" fill="#6B3FA0" font-size="16" font-weight="700" text-anchor="start">02</text><text x="940" y="239" fill="#003E74" font-size="23" font-weight="700" text-anchor="start">Learn useful behaviours</text><text x="940" y="294" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">What knowledge can transfer</text><text x="940" y="320" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">with limited new data?</text><rect x="42" y="438" width="320" height="204" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(64 458) scale(0.75)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v50M32 6v50M52 6v50"/><circle cx="12" cy="21" r="6"/><circle cx="32" cy="42" r="6"/><circle cx="52" cy="27" r="6"/></g><text x="132" y="487" fill="#6B3FA0" font-size="16" font-weight="700" text-anchor="start">03</text><text x="64" y="541" fill="#003E74" font-size="23" font-weight="700" text-anchor="start">Adapt action and</text><text x="64" y="569" fill="#003E74" font-size="23" font-weight="700" text-anchor="start">assistance</text><text x="64" y="596" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">How should control respond</text><text x="64" y="622" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">to the task and operator?</text><rect x="918" y="438" width="320" height="204" rx="18" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="2"/><g transform="translate(940 458) scale(0.75)" fill="none" stroke="#003E74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m32 5 23 13v27L32 59 9 45V18L32 5Zm0 27v27M9 18l23 14 23-14"/></g><text x="1008" y="487" fill="#6B3FA0" font-size="16" font-weight="700" text-anchor="start">04</text><text x="940" y="541" fill="#003E74" font-size="23" font-weight="700" text-anchor="start">Design physical</text><text x="940" y="569" fill="#003E74" font-size="23" font-weight="700" text-anchor="start">capability</text><text x="940" y="596" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">How do sensors, tools and</text><text x="940" y="622" fill="#506A82" font-size="18" font-weight="400" text-anchor="start">actuation shape what is possible?</text><text x="640" y="690" fill="#506A82" font-size="16" font-weight="400" text-anchor="middle">Programme synthesis. The connections guide research questions; they do not describe one completed general-purpose system.</text></g></svg>