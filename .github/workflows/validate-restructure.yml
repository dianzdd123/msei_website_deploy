name: Validate MSEI website restructuring

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python, JSON and public site privacy
        run: |
          python3 scripts/check_public_content.py
          python3 scripts/check_repository.py
          python3 scripts/check_portfolio_routes.py
      - name: Check JavaScript module syntax
        run: |
          for file in assets/index-uZzEyxeI.20261112lab.js assets/ProgrammeHub.20261112.js assets/NavigationEditorial.20261112lab.js assets/LabReferral.20261112.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Confirm no private Git history copied into public deploy
        run: |
          test ! -d .git/modules
          test ! -d private
          test ! -d internal
          test -f msei_website/projects/index.html
          test -f msei_website/capabilities/index.html
          test -f msei_website/impact/index.html
