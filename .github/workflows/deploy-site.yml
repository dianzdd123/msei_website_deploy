name: Validate and deploy public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize reviewed snapshot without Git history
        run: python3 scripts/bootstrap_site.py
      - name: Validate public content and website structure
        run: |
          python3 scripts/check_public_content.py
          python3 scripts/check_repository.py
      - name: Retain editable public website files
        run: |
          if compgen -G 'public-site-part-*.zip' > /dev/null; then
            git rm public-site-part-*.zip
            git add assets data docs scripts msei_website .gitignore README.md CONTRIBUTING.md _config.yml index.html 404.html CNAME
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Materialize reviewed public website without private history'
            git push origin HEAD:main
          fi
      - name: Stage only website assets
        run: |
          mkdir _site
          cp -R assets data msei_website _site/
          cp index.html 404.html CNAME _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
